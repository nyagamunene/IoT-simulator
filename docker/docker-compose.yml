# Docker Compose for IoT Device Simulator Test Infrastructure
#
# This provides complete test infrastructure for all supported protocols:
#   - MQTT (Mosquitto broker on port ${MQTT_PORT})
#   - HTTP (Test server on port ${HTTP_PORT})
#   - WebSocket (Test server on port ${WEBSOCKET_PORT})
#   - CoAP (Test server on port ${COAP_PORT}/udp)
#
# Port Configuration:
#   Ports are configured in the .env file in this directory.
#   You can override them by copying .env to .env.local and modifying values.
#
# Quick Start:
#   make servers-up     # Start all test servers
#   make run            # Run the simulator (in another terminal)
#   make servers-logs   # View server logs
#   make servers-down   # Stop all servers
#
# Individual Services:
#   make mqtt-up        # Start only MQTT broker
#   make http-up        # Start only HTTP server
#   make ws-up          # Start only WebSocket server
#   make coap-up        # Start only CoAP server

services:
  # Mosquitto MQTT Broker for testing
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: iot-mqtt-broker
    ports:
      - "${MQTT_PORT}:1883"  # MQTT
      - "${MQTT_WS_PORT}:9001"  # MQTT over WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iot-network

  # HTTP test server
  http-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.http
    container_name: iot-http-server
    ports:
      - "${HTTP_PORT}:8080"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iot-network

  # WebSocket test server
  websocket-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.websocket
    container_name: iot-websocket-server
    ports:
      - "${WEBSOCKET_PORT}:8765"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iot-network

  # CoAP test server
  coap-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.coap
    container_name: iot-coap-server
    ports:
      - "${COAP_PORT}:5683/udp"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge
